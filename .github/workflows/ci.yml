name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `tsc -b`, not `tsc --noEmit`: the root tsconfig is references-only, so
      # --noEmit type-checks nothing and exits 0. That false pass is how 65 type
      # errors reached main unnoticed.
      - name: Typecheck
        run: npm run typecheck

      # Warnings are the pre-existing backlog; the cap ratchets down as it is
      # paid off. Any *new* warning fails the build.
      - name: Lint
        run: npx eslint . --max-warnings 47

      # Dead files were 11 before this refactor and 0 after. Gating here is what
      # stops them silently accumulating again.
      - name: Dead code
        run: npm run lint:dead

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Needs live Supabase credentials; skipped on forks where secrets are absent.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
