/* ---- jumpnav scroll-spy ---- */
(function(){
  var links=Array.prototype.slice.call(document.querySelectorAll('.jumpnav a'));

  var obs=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ links.forEach(function(l){l.classList.remove('active');}); var t=map[e.target.id]; if(t&&!t.classList.contains('cur')) t.classList.add('active'); } });
  },{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll('article.opt').forEach(function(a){obs.observe(a);});
